# =============================================================================
# GitHub Actions — Deploy Frontend to Azure Static Web Apps
# =============================================================================
# Triggers on every push to `main` that modifies the frontend/ directory.
# Azure Static Web Apps provides a free, globally distributed CDN for the
# React/Vite SPA with automatic HTTPS.
#
# SETUP REQUIRED:
#   1. Create an Azure Static Web App in the Azure Portal.
#   2. Copy the deployment token from Azure Portal → Static Web App → Manage deployment token.
#   3. Add it as a GitHub Repository Secret named: AZURE_STATIC_WEB_APPS_API_TOKEN
#   4. Add another secret named: VITE_API_URL set to your Azure VM's public URL
#      (e.g., http://<VM-PUBLIC-IP> or https://your-domain.com)
# =============================================================================

name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - "frontend/**"
  workflow_dispatch:  # Allow manual triggers from GitHub UI

jobs:
  build_and_deploy:
    # Skip closed PRs that were NOT merged
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/dist"    # Vite build output
          skip_app_build: true             # We already built above
          skip_api_build: true             # No Azure Functions API

  # ---------------------------------------------------------------------------
  # Close job — Automatically cleans up preview environments for closed PRs
  # ---------------------------------------------------------------------------
  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR Preview
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
